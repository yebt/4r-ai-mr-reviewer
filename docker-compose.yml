# Docker Compose deploy for Dokploy — see docs/DEPLOY-DOKPLOY.md.
#
# Two services on one Docker network:
#   - api: the Go server (not published; only `web` reaches it)
#   - web: nginx serving the SPA and proxying the API — attach your domain here
#
# In Dokploy, set the variables below in the Compose app's Environment settings.
services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      AIR_HTTP_ADDR: ":8080"
      AIR_DB_PATH: "/data/ai-reviewer.db"
      AIR_KEYFILE_PATH: "/data/ai-reviewer.db.key"
      # Behind Dokploy/Traefik + the web nginx: trust X-Forwarded-Proto so the
      # session cookie is marked Secure on HTTPS.
      AIR_TRUST_PROXY: "true"
      # STRONGLY recommended on a public deploy: gate the API behind a password.
      AIR_AUTH_PASSWORD: "${AIR_AUTH_PASSWORD}"
      AIR_AUTH_SESSION_HOURS: "${AIR_AUTH_SESSION_HOURS:-168}"
      # Secret for GitLab/Telegram webhooks (Telegram bot go-live); optional.
      AIR_TELEGRAM_WEBHOOK_SECRET: "${AIR_TELEGRAM_WEBHOOK_SECRET:-}"
      AIR_REVIEW_CONCURRENCY: "${AIR_REVIEW_CONCURRENCY:-2}"
      AIR_REASONING_BUDGET: "${AIR_REASONING_BUDGET:-0}"
      AIR_ROUTINE_MERGE_TIMEOUT: "${AIR_ROUTINE_MERGE_TIMEOUT:-1800}"
      # Optional: password-encrypt the secret vault instead of the on-disk
      # key-file. If set, the key-file is NOT used. See the guide's Security note.
      # AIR_PASSWORD: "${AIR_PASSWORD:-}"
    volumes:
      # Persistent: the SQLite DB and the vault key-file. Losing this volume
      # loses all data AND makes stored tokens/keys unrecoverable.
      - air-data:/data

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api
    # Dokploy attaches the public domain to this service's port 80.
    ports:
      - "80"

volumes:
  air-data:
