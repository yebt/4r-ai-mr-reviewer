# nginx for the `web` image: serve the built SPA and reverse-proxy the API on
# ONE origin. Same-origin matters — the API's session cookie is httpOnly and
# sent with credentials:'same-origin', so the SPA and API must share a host.
#
# The SPA calls the API under /api (its BASE), which is stripped here before
# forwarding. GitLab and Telegram post their webhooks to root paths
# (/webhooks/..., /telegram/webhook), so those are proxied without stripping.

upstream air_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Diffs / webhook payloads can be sizeable.
    client_max_body_size 25m;

    # Preserve the scheme the OUTER proxy (Dokploy/Traefik) terminated TLS with,
    # so the API's AIR_TRUST_PROXY logic can set a Secure cookie. Traefik sets
    # X-Forwarded-Proto=https; we pass it through unchanged rather than
    # overwriting it with this hop's ($scheme = http inside the container).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # Reviews and the routine merge-wait can run long server-side.
    proxy_read_timeout 600s;

    # SPA → API: strip the /api prefix (trailing slash on proxy_pass does it).
    location /api/ {
        proxy_pass http://air_api/;
    }

    # External inbound webhooks + health checks — NOT under /api.
    location /webhooks/ {
        proxy_pass http://air_api;
    }
    location = /telegram/webhook {
        proxy_pass http://air_api;
    }
    location = /health {
        proxy_pass http://air_api;
    }

    # Everything else is the SPA; unknown paths fall back to index.html so the
    # client-side router can handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
